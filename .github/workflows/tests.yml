name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-native-v0.8.3
      JOLT_VERSION: 0.8.3
      JOLT_SOURCE_COMMIT: 343f730922cf16fafe673b466cedcdcfe0596854
      JOLT_INSTALLER_SHA256: 6e9e16d1db9875fd3e52e5143eab71375c00f44f3b5d321d61e9996a3c948736
      JOLT_ARCHIVE_SHA256: e567297a6a840d9988a1aa082beb430aeaa0e6610a82a6f9ee0564e117745147
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned Jolt
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/install-jolt"
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL --retry 2 --retry-all-errors \
            "https://raw.githubusercontent.com/jolt-lang/jolt/$JOLT_SOURCE_COMMIT/install" \
            -o "$installer"
          echo "$JOLT_INSTALLER_SHA256  $installer" | sha256sum -c -
          bash "$installer" \
            --dir "$install_dir" \
            --version "$JOLT_VERSION" \
            --checksum "$JOLT_ARCHIVE_SHA256"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(jolt --version)" = "jolt v$JOLT_VERSION"
          jolt -Srepro -Sdescribe
      - name: Install pinned Hegel native test library
        run: jolt -Srepro -A:test -m hegel.install
      - name: Run aggregate tests
        run: jolt -Srepro -M:test -m otel.test-runner
