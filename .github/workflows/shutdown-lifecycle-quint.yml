name: shutdown-lifecycle-quint

on:
  workflow_dispatch:
    inputs:
      force_both:
        description: Run both 10k sampled shutdown-model campaigns
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/shutdown-lifecycle-quint.yml
      - formal/quint/shutdown-lifecycle.md
      - scripts/check-shutdown-lifecycle-quint.sh
      - scripts/classify-shutdown-lifecycle-quint-paths.sh
      - scripts/fingerprint-shutdown-lifecycle-quint-inputs.sh
      - test/shutdown-lifecycle-model-path-classifier.sh
      - src/otel/sdk.clj
      - src/otel/sdk/lifecycle.clj
      - src/otel/sdk/export.clj
      - src/otel/sdk/logs.clj
      - src/otel/sdk/metrics.clj
      - test/otel/sdk/lifecycle_events.clj
      - test/otel/sdk/lifecycle_test.clj
  push:
    branches: [main]
    paths:
      - .github/workflows/shutdown-lifecycle-quint.yml
      - formal/quint/shutdown-lifecycle.md
      - scripts/check-shutdown-lifecycle-quint.sh
      - scripts/classify-shutdown-lifecycle-quint-paths.sh
      - scripts/fingerprint-shutdown-lifecycle-quint-inputs.sh
      - test/shutdown-lifecycle-model-path-classifier.sh
      - src/otel/sdk.clj
      - src/otel/sdk/lifecycle.clj
      - src/otel/sdk/export.clj
      - src/otel/sdk/logs.clj
      - src/otel/sdk/metrics.clj
      - test/otel/sdk/lifecycle_events.clj
      - test/otel/sdk/lifecycle_test.clj

permissions:
  contents: read

jobs:
  classify-model-inputs:
    name: Classify shutdown model inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lifecycle: ${{ steps.decision.outputs.lifecycle }}
      settlement: ${{ steps.decision.outputs.settlement }}
      reason: ${{ steps.decision.outputs.reason }}
      changed_count: ${{ steps.decision.outputs.changed_count }}
      # All downstream model executions must use this exact Git commit, rather
      # than GitHub's pull_request synthetic merge revision.
      revision: ${{ steps.decision.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
      - name: Install pinned effective-input tangler
        shell: bash
        run: |
          set -euo pipefail
          lmt_dir="$RUNNER_TEMP/lmt-bin"
          mkdir -p "$lmt_dir"
          GOBIN="$lmt_dir" go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
          echo "$lmt_dir" >> "$GITHUB_PATH"
      - name: Assert tangler provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version -m "$(command -v lmt)" | awk '$1 == "mod" { print $3 }')" = "v0.0.0-20210421124901-62fe18f2f6a6"
      - name: Test source-only model-input classification
        run: test/shutdown-lifecycle-model-path-classifier.sh
      - name: Classify exact base and head
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_FORCE_BOTH: ${{ inputs.force_both }}
        shell: bash
        run: |
          set -euo pipefail
          decision_file=$(mktemp)
          cleanup() { rm -f -- "$decision_file"; }
          trap cleanup EXIT HUP INT TERM
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$MANUAL_FORCE_BOTH" == true ]]; then
              printf 'lifecycle=true\nsettlement=true\nreason=manual-force-both\nchanged_count=0\n' > "$decision_file"
            else
              printf 'lifecycle=false\nsettlement=false\nreason=manual-deterministic-only\nchanged_count=0\n' > "$decision_file"
            fi
          else
            ensure_object() {
              local label=$1 revision=$2
              if [[ ! $revision =~ ^[0-9a-fA-F]{40}$ ]] || [[ $revision =~ ^0+$ ]]; then
                echo "$label object is missing or zero; classifier will fail closed"
                return 0
              fi
              git fetch --no-tags origin "$revision" || echo "$label fetch did not complete; classifier checks local object"
            }
            ensure_object base "$BASE_SHA"
            ensure_object head "$HEAD_SHA"
            diff_args=(--diff "$BASE_SHA" "$HEAD_SHA")
            [[ "$EVENT_NAME" == pull_request ]] && diff_args+=(--merge-base)
            scripts/classify-shutdown-lifecycle-quint-paths.sh "${diff_args[@]}" > "$decision_file"
          fi
          for key in lifecycle settlement; do
            count=$(grep -c "^${key}=" "$decision_file" || true)
            value=$(sed -n "s/^${key}=//p" "$decision_file")
            test "$count" = 1
            test "$value" = true || test "$value" = false
          done
          test "$(grep -c '^reason=' "$decision_file" || true)" = 1
          test "$(grep -c '^changed_count=' "$decision_file" || true)" = 1
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          cat "$decision_file"
          cat "$decision_file" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Record immutable classification receipt
        env:
          LIFECYCLE: ${{ steps.decision.outputs.lifecycle }}
          SETTLEMENT: ${{ steps.decision.outputs.settlement }}
          REASON: ${{ steps.decision.outputs.reason }}
          CHANGED_COUNT: ${{ steps.decision.outputs.changed_count }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/formal/quint
          printf 'lifecycle=%s\nsettlement=%s\nreason=%s\nchanged_count=%s\nbase=%s\nhead=%s\n' \
            "$LIFECYCLE" "$SETTLEMENT" "$REASON" "$CHANGED_COUNT" "$BASE_SHA" "$HEAD_SHA" \
            > target/formal/quint/shutdown-model-classification.receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shutdown-model-classification-receipt
          path: target/formal/quint/shutdown-model-classification.receipt
          if-no-files-found: error

  deterministic-model-controls:
    name: Shutdown model deterministic controls
    needs: classify-model-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: test "${{ needs.classify-model-inputs.result }}" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.classify-model-inputs.outputs.revision }}
      - name: Assert classified revision checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.classify-model-inputs.outputs.revision }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
      - name: Install pinned Quint and literate tangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @informalsystems/quint@0.32.0
          lmt_dir="$RUNNER_TEMP/lmt-bin"
          mkdir -p "$lmt_dir"
          GOBIN="$lmt_dir" go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
          echo "$lmt_dir" >> "$GITHUB_PATH"
      - name: Assert tool provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(quint --version)" = "0.32.0"
          test "$(go version -m "$(command -v lmt)" | awk '$1 == "mod" { print $3 }')" = "v0.0.0-20210421124901-62fe18f2f6a6"
      - name: Tangle, typecheck, and run deterministic controls
        run: scripts/check-shutdown-lifecycle-quint.sh --deterministic

  sample-lifecycle:
    name: Shutdown lifecycle sampled campaign
    needs: [classify-model-inputs, deterministic-model-controls]
    if: ${{ needs.classify-model-inputs.outputs.lifecycle == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: test "${{ needs.deterministic-model-controls.result }}" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.classify-model-inputs.outputs.revision }}
      - name: Assert classified revision checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.classify-model-inputs.outputs.revision }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
      - name: Install pinned Quint and literate tangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @informalsystems/quint@0.32.0
          lmt_dir="$RUNNER_TEMP/lmt-bin"
          mkdir -p "$lmt_dir"
          GOBIN="$lmt_dir" go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
          echo "$lmt_dir" >> "$GITHUB_PATH"
      - name: Assert tool provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(quint --version)" = "0.32.0"
          test "$(go version -m "$(command -v lmt)" | awk '$1 == "mod" { print $3 }')" = "v0.0.0-20210421124901-62fe18f2f6a6"
      - name: Tangle, typecheck, and sample lifecycle
        run: scripts/check-shutdown-lifecycle-quint.sh --sample lifecycle

  sample-settlement:
    name: Shutdown settlement sampled campaign
    needs: [classify-model-inputs, deterministic-model-controls]
    if: ${{ needs.classify-model-inputs.outputs.settlement == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: test "${{ needs.deterministic-model-controls.result }}" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.classify-model-inputs.outputs.revision }}
      - name: Assert classified revision checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.classify-model-inputs.outputs.revision }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
      - name: Install pinned Quint and literate tangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @informalsystems/quint@0.32.0
          lmt_dir="$RUNNER_TEMP/lmt-bin"
          mkdir -p "$lmt_dir"
          GOBIN="$lmt_dir" go install github.com/driusan/lmt@62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c
          echo "$lmt_dir" >> "$GITHUB_PATH"
      - name: Assert tool provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(quint --version)" = "0.32.0"
          test "$(go version -m "$(command -v lmt)" | awk '$1 == "mod" { print $3 }')" = "v0.0.0-20210421124901-62fe18f2f6a6"
      - name: Tangle, typecheck, and sample settlement
        run: scripts/check-shutdown-lifecycle-quint.sh --sample settlement
  literate-model:
    # Preserve the historical required-check name. It represents the old
    # monolithic contract by requiring controls plus every selected campaign.
    name: literate-model
    needs: [classify-model-inputs, deterministic-model-controls, sample-lifecycle, sample-settlement]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected campaigns and deterministic controls
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.classify-model-inputs.result }}" = success
          test "${{ needs.deterministic-model-controls.result }}" = success
          if [[ "${{ needs.classify-model-inputs.outputs.lifecycle }}" == true ]]; then
            test "${{ needs.sample-lifecycle.result }}" = success
          else
            test "${{ needs.sample-lifecycle.result }}" = skipped
          fi
          if [[ "${{ needs.classify-model-inputs.outputs.settlement }}" == true ]]; then
            test "${{ needs.sample-settlement.result }}" = success
          else
            test "${{ needs.sample-settlement.result }}" = skipped
          fi
      - name: Report selection receipt
        run: |
          echo "lifecycle=${{ needs.classify-model-inputs.outputs.lifecycle }}"
          echo "settlement=${{ needs.classify-model-inputs.outputs.settlement }}"
          echo "reason=${{ needs.classify-model-inputs.outputs.reason }}"
          echo "changed_count=${{ needs.classify-model-inputs.outputs.changed_count }}"
